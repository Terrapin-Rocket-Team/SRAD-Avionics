; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -Wno-unknown-pragmas
lib_compat_mode = strict
lib_deps = https://github.com/DrewBrandt/arc-protocol.git

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Wno-unknown-pragmas
lib_compat_mode = strict
lib_deps = https://github.com/DrewBrandt/arc-protocol.git

[env:main]
platform = ststm32
framework = arduino
build_flags = -Wno-unknown-pragmas
board = generic
lib_deps = https://github.com/DrewBrandt/arc-protocol.git
lib_compat_mode = strict
; PlatformIO's bundled OpenOCD can connect to STM32C0 over ST-Link, but this
; version cannot identify/program the C0 flash. Use ST's programmer for upload.
upload_protocol = custom
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" -c port=SWD mode=UR -d "$SOURCE" 0x08000000 -v -rst

