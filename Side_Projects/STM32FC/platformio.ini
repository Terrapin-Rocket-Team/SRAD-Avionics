; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps = 
lib_compat_mode = strict
build_flags = 
	-Wno-unknown-pragmas
	-std=gnu++17

[env:stm32h723vehx]
platform = ststm32
framework = arduino
board = stm32h723vehx
board_build.variants_dir = custom_variants
board_build.ldscript = ldscripts/ldscript.ld
lib_deps = 
	${env.lib_deps}
	Wire
	https://github.com/stm32duino/FatFs.git
	https://github.com/jgromes/RadioLib.git
	https://github.com/Terrapin-Rocket-Team/Astra-Rocket.git#airbrake
	; ARC wire format (FC telemetry/heartbeat/data-radio downlink). Uses the local
	; working tree so schema edits + regen are picked up without a push. Needs
	; Windows Developer Mode (or admin) for the symlink; otherwise commit/push
	; arc-protocol and use: https://github.com/DrewBrandt/arc-protocol.git
	symlink://C:/Users/Drew/Documents/arc-protocol
	; RadioMessage (APRSTelem) frame builder for the data-radio downlink
	https://github.com/erodarob/RadioMessage.git
build_flags =
	${env.build_flags}
	-D ENV_STM
	-D STM32
	-D ARDUINO_GENERIC_H723VEHX
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USE_USB_HS
	-D USE_USB_HS_IN_FS
	-D USE_USB_CONSOLE
	-D ENABLE_HWSERIAL1
	-D USE_PWR_LDO_SUPPLY
	-D PIN_SERIAL1_TX=PB6
	-D PIN_SERIAL1_RX=PB7
	; RadioMessage defaults to a 10 KB buffer per Message; our frames are tiny.
	-D MSG_SIZE_OVRD=255
	-Wl,-u,_printf_float
